name: Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and analyze providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Cache Sonar packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Install SonarScanner for .NET
        run: dotnet tool install --tool-path .sonar/scanner dotnet-sonarscanner --version 11.3.0

      - name: Begin SonarQube Cloud analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./.sonar/scanner/dotnet-sonarscanner begin
          /k:holmesmojica-dev_hm-logging-providers
          /o:holmesmojica-dev
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.qualitygate.wait=true
          /d:sonar.cs.vscoveragexml.reportsPaths=TestResults/coverage/coverage.xml
          /d:sonar.exclusions=**/obj/**,**/bin/**
          /d:sonar.coverage.exclusions=**/obj/**,**/bin/**

      - name: Run full Quality validation with coverage
        shell: pwsh
        run: ./scripts/validate.ps1 -CollectCoverage

      - name: Complete analysis and enforce Quality Gate
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependencies
        uses: actions/dependency-review-action@72eb03d02c7872a771aacd928f3123ac62ad6d3a # v4.1.3
        with:
          fail-on-severity: moderate
