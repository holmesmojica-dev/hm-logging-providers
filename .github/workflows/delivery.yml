name: Delivery

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: read

concurrency:
  group: hm-logging-providers-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight and main eligibility
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_unit: ${{ steps.release.outputs.release_unit }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      package_id: ${{ steps.release.outputs.package_id }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Resolve enabled release identity
        id: release
        shell: pwsh
        run: ./scripts/Resolve-Release.ps1 -Tag "$env:GITHUB_REF_NAME" -MainBranch origin/main -RequirePublicationEnabled -GitHubOutputPath "$env:GITHUB_OUTPUT"
      - name: Verify exact main Quality eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-EligibleMainCommit.ps1 -Commit "${{ steps.release.outputs.source_commit }}" -Repository "$env:GITHUB_REPOSITORY"

  build-artifact:
    name: Build and validate release artifact
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      artifact_name: release-packages
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build, package, validate, and hash once
        shell: pwsh
        run: >
          ./scripts/Build-ReleaseArtifact.ps1
          -ReleaseUnit "${{ needs.preflight.outputs.release_unit }}"
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
          -SourceCommit "${{ needs.preflight.outputs.source_commit }}"
          -OutputDirectory artifacts/packages
      - name: Upload validated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    name: Attest, publish, and verify NuGet
    needs: [preflight, build-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      nuget_state: ${{ steps.resolve.outputs.nuget_state == 'already_verified' && steps.resolve.outputs.nuget_state || steps.publish.outputs.nuget_state }}
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-artifact.outputs.artifact_name }}
          path: artifacts/packages
      - name: Verify artifact integrity
        shell: pwsh
        run: ./scripts/Assert-ReleaseArtifactManifest.ps1 -PackageDirectory artifacts/packages -PackageId "${{ needs.preflight.outputs.package_id }}" -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
      - name: Resolve idempotent NuGet state
        id: resolve
        shell: pwsh
        run: >
          ./scripts/Resolve-NuGetRelease.ps1
          -PackageDirectory artifacts/packages
          -ReleaseUnit "${{ needs.preflight.outputs.release_unit }}"
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
          -SourceCommit "${{ needs.preflight.outputs.source_commit }}"
          -GitHubOutputPath "$env:GITHUB_OUTPUT"
      - name: Attest exact NuGet package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/${{ needs.preflight.outputs.package_id }}.${{ needs.preflight.outputs.release_version }}.nupkg
      - name: Attest exact symbol package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/${{ needs.preflight.outputs.package_id }}.${{ needs.preflight.outputs.release_version }}.snupkg
      - name: Verify attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "artifacts/packages/${{ needs.preflight.outputs.package_id }}.${{ needs.preflight.outputs.release_version }}.nupkg" --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/delivery.yml"
          gh attestation verify "artifacts/packages/${{ needs.preflight.outputs.package_id }}.${{ needs.preflight.outputs.release_version }}.snupkg" --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/delivery.yml"
      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        if: steps.resolve.outputs.nuget_state == 'publish'
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish and remotely verify exact package
        id: publish
        if: steps.resolve.outputs.nuget_state == 'publish'
        shell: pwsh
        env:
          NUGET_TRUSTED_PUBLISHING_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          ./scripts/Publish-NuGetRelease.ps1
          -PackageDirectory artifacts/packages
          -ReleaseUnit "${{ needs.preflight.outputs.release_unit }}"
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
          -SourceCommit "${{ needs.preflight.outputs.source_commit }}"
          -GitHubOutputPath "$env:GITHUB_OUTPUT"

  post-publication:
    name: Create or verify GitHub Release
    needs: [preflight, build-artifact, publish-nuget]
    if: needs.publish-nuget.outputs.nuget_state == 'published' || needs.publish-nuget.outputs.nuget_state == 'already_verified'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - name: Create or verify release record
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-GitHubRelease.ps1 -Tag "${{ needs.preflight.outputs.release_tag }}" -ReleaseVersion "${{ needs.preflight.outputs.release_version }}" -Repository "$env:GITHUB_REPOSITORY"
